  id: secure_channel_crypto
  implementation_state: implemented
  kconfig_symbol: SECURE_CHANNEL_CRYPTO
  kind: optimization
  notes: Build gate that decouples secure-channel message crypto (symmetric/asymmetric chunk crypto, certificate, trustlist, key derivation) from the MUC_OPCUA_FACET_CORE_2022_SERVER umbrella. Defaults
    off for nano (SecurityPolicy None only per OPC-10000-7 4.3) and on for the security-capable micro/embedded/standard/full profiles (profile intent, not backend presence -- spec 072 FR-005). When off
    the heavy crypto TUs are excluded and MUC_OPCUA_CU_SECURITY_ECC / crypto backends cannot be enabled; SecurityPolicy None behaviour and explicit non-None rejection are preserved.
  opc_display_name: Secure channel message crypto
  opc_reference:
    facet: null
    section: '4.3'
    spec: OPC-10000-7
