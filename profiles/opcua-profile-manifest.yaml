advertised_profile_markers:
- default_if:
  - MUC_OPCUA_INTERN_PROFILE_STANDARD_2025_UA_SERVER
  id: MUC_OPCUA_MARKER_STANDARD_PROFILE
  note: Advertised-profile marker; drives base_nodes.c ServerProfileArray + capacities.h tier. EMBEDDED_PROFILE is intentionally absent (CMake-only, never a C define).
